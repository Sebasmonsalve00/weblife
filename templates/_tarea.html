{# Pedacito reutilizable: una fila de tarea con sus botones #}
<li class="{{ 'hecha' if tarea.hecha }}">
  <form method="post" action="{{ url_for('cambiar_tarea', id=tarea.id) }}" class="en-linea">
    <button class="check">{{ "✔" if tarea.hecha else "○" }}</button>
  </form>
  <b>{{ tarea.fecha_entrega }}</b> {{ tarea.titulo }}
  {% if tarea.materia %}<span class="etiqueta">{{ tarea.materia }}</span>{% endif %}
  <form method="post" action="{{ url_for('borrar_tarea', id=tarea.id) }}" class="en-linea">
    <button class="borrar" title="Borrar">✕</button>
  </form>
</li>
